<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>TMS Admin Login</title>
    <link rel="stylesheet" href="./static/css/bootstrap.min.css">
    <link href="./static/scripts/vendor/fontawesome-free/css/all.min.css" rel="stylesheet" type="text/css">
    <style>
        :root {
            --input-padding-x: 1.5rem;
            --input-padding-y: .75rem;
        }
        body {
            background: linear-gradient(135deg, #184474 0%, #1a5276 50%, #2e86c1 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 15px;
        }
        .brand-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .brand-header i {
            font-size: 3rem;
            color: white;
            margin-bottom: 10px;
        }
        .brand-header h2 {
            color: white;
            font-weight: 300;
        }
        .brand-header p {
            color: rgba(255,255,255,0.7);
            font-size: 0.9rem;
        }
        .card-signin {
            border: 0;
            border-radius: 1rem;
            box-shadow: 0 0.5rem 2rem 0 rgba(0, 0, 0, 0.2);
        }
        .card-signin .card-title {
            margin-bottom: 2rem;
            font-weight: 300;
            font-size: 1.5rem;
            color: #184474;
        }
        .card-signin .card-body {
            padding: 2rem;
        }
        .form-signin .btn {
            font-size: 80%;
            border-radius: 5rem;
            letter-spacing: .1rem;
            font-weight: bold;
            padding: 1rem;
            background-color: #184474;
            border: none;
            transition: all 0.2s;
        }
        .form-signin .btn:hover {
            background-color: #2e86c1;
        }
        .form-label-group {
            position: relative;
            margin-bottom: 1rem;
        }
        .form-label-group input {
            height: auto;
            border-radius: 2rem;
            padding: var(--input-padding-y) var(--input-padding-x);
        }
        .demo-info {
            text-align: center;
            margin-top: 20px;
            color: rgba(255,255,255,0.8);
            font-size: 0.85rem;
        }
        .demo-info strong {
            color: white;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="brand-header">
            <i class="fas fa-shipping-fast"></i>
            <h2>Transportation Management System</h2>
            <p>Admin Panel</p>
        </div>

        <div class="card card-signin">
            <div class="card-body">
                <h5 class="card-title text-center"><strong>Admin Login</strong></h5>
                <form class="form-signin" action="" method="post">
                    <div class="form-label-group">
                        <input type="text" id="inputUsername" name="username" class="form-control" placeholder="Username" required autofocus>
                    </div>
                    <div class="form-label-group">
                        <input type="password" id="inputPassword" name="password" class="form-control" placeholder="Password" required>
                    </div>
                    {% if error_message %}
                    <div class="alert alert-danger text-center" role="alert">
                        {{ error_message }}
                    </div>
                    {% endif %}
                    <input class="btn btn-lg btn-primary btn-block text-uppercase" type="submit" name="loginBtn" value="Sign In">
                </form>
            </div>
        </div>

        <div class="demo-info">
            <p><strong>Demo credentials:</strong> admin / admin123</p>
        </div>
    </div>
</body>
</html>
